[package]
name = "photobooth-core"
version = "0.1.0"
description = "Platform-agnostic photobooth domain: camera trait, session state machine, settings, photo store, mock camera"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
async-trait = "0.1"
bytes = "1"
futures-core = "0.3"
jpeg-encoder = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["sync", "time", "rt", "macros"] }
tokio-stream = "0.1"
tracing = "0.1"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["sync", "time", "rt", "macros", "test-util"] }
futures-util = "0.3"
jpeg-decoder = "0.3"
