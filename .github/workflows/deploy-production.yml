name: Deploy production

# Production deploys only ever run from here, started by hand from main AND approved by the required
# reviewer on the `production` environment (SETUP.md E). Agents never start it (AGENTS.md). It is
# not used before session 18: until SETUP F has created the production D1, R2 and secrets and
# filled env.production in wrangler.jsonc, the preflight step stops it before anything is touched.
# A production smoke run is session 18's decision.

on:
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

env:
  WRANGLER_VERSION: "4.151.3"

jobs:
  production:
    name: Deploy (production)
    # The environment also allows main only; this stops a run from another ref before it waits for approval.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/portal
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"

      - run: bun install --frozen-lockfile
      - name: Preflight (env.production is filled in)
        run: bun run scripts/preflight.ts --env production
      - run: bun run typecheck
      - run: bun run test
      - run: bun run build

      - name: Apply D1 migrations
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/portal
          wranglerVersion: ${{ env.WRANGLER_VERSION }}
          packageManager: bun
          command: d1 migrations apply DB --env production --remote

      - name: Deploy portal
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/portal
          wranglerVersion: ${{ env.WRANGLER_VERSION }}
          packageManager: bun
          command: deploy --env production --var GIT_SHA:${{ github.sha }}
