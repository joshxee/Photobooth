name: CI

# Local/CI only: no cloud device farms. The Android job produces a debug APK as an artifact;
# running it on the tablet is a manual step (see wiki/Android-Build.md).

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust (fmt, clippy, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      # Tauri's Linux build needs WebKitGTK; libusb is vendored (built from source).
      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev patchelf build-essential pkg-config \
            libudev-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      # The Tauri app embeds the built frontend (frontendDist = ../dist).
      - name: Build the frontend
        working-directory: apps/booth
        run: |
          bun install --frozen-lockfile
          bun run build

      - run: cargo fmt --all -- --check

      - name: Clippy
        run: |
          cargo clippy -p photobooth-core --all-targets -- -D warnings
          cargo clippy -p sony-ptp --all-targets --all-features -- -D warnings
          cargo clippy -p tauri-plugin-photobooth-camera --all-targets --all-features -- -D warnings
          cargo clippy -p photobooth --all-targets -- -D warnings

      - name: Test
        run: |
          cargo test -p photobooth-core
          cargo test -p sony-ptp
          cargo test -p sony-ptp --all-features
          cargo test -p tauri-plugin-photobooth-camera
          cargo test -p tauri-plugin-photobooth-camera --all-features
          cargo test -p photobooth

  frontend:
    name: Frontend (typecheck, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/booth
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test
      - run: bun run build

  android:
    name: Android debug APK
    runs-on: ubuntu-latest
    needs: [rust, frontend]
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: Android SDK, build tools and NDK
        run: |
          # The generated project (src-tauri/gen/android) uses compileSdk 37; the plugin uses 36.
          sdkmanager "platforms;android-36" "platforms;android-37.0"             "build-tools;36.0.0" "build-tools;37.0.0" "platform-tools" "ndk;28.0.13004108"
          echo "NDK_HOME=$ANDROID_HOME/ndk/28.0.13004108" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - uses: Swatinem/rust-cache@v2

      - name: Install frontend dependencies
        working-directory: apps/booth
        run: bun install --frozen-lockfile

      # Includes the dev capability so the debug APK's test-mode dev panel works on the tablet.
      - name: Build the debug APK
        working-directory: apps/booth
        run: bun x tauri android build --apk --debug --ci --target aarch64 --config src-tauri/tauri.dev.conf.json

      - uses: actions/upload-artifact@v4
        with:
          name: photobooth-debug-apk
          path: apps/booth/src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
