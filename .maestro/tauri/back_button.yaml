appId: com.jc.photobooth.tauri
---
# The hardware Back button leaves the booth instead of closing the app.
- launchApp:
    stopApp: false
- extendedWaitUntil:
    visible: "Select Camera"
    timeout: 20000
- tapOn: "Test Camera.*"
- tapOn: "Continue →"
- extendedWaitUntil:
    visible: "Tap to start photoshoot"
    timeout: 15000
- back
- extendedWaitUntil:
    visible: "Select Camera"
    timeout: 10000
