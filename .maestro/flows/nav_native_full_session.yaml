appId: com.jc.photobooth
---
- stopApp
- launchApp
- assertVisible: "Select Camera"
- tapOn: "Mock Camera (Testing)"
- tapOn: "Continue →"
- tapOn:
    text: "While using the app"
    optional: true
- tapOn:
    text: "Allow"
    optional: true
- takeScreenshot: 01_attract_or_preview
- extendedWaitUntil:
    visible: "Look at the lens"
    timeout: 10000
- takeScreenshot: 02_countdown
- extendedWaitUntil:
    visible: "Looking good."
    timeout: 30000
- assertVisible: "VIRTUAL PHOTO STRIP SAVED"
- assertVisible: "Take another strip →"
- takeScreenshot: 03_strip_review
- extendedWaitUntil:
    visible: "RAISE A HAND"
    timeout: 5000
    optional: true
- extendedWaitUntil:
    visible: "Look at the lens"
    timeout: 20000
- takeScreenshot: 04_auto_restart
