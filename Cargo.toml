[workspace]
resolver = "2"
members = ["crates/photobooth-core", "crates/sony-ptp", "plugins/tauri-plugin-photobooth-camera", "apps/booth/src-tauri"]

[workspace.package]
edition = "2021"
license = "MIT"
rust-version = "1.87"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

# Mock-camera JPEG synthesis runs on the tablet in debug builds too; keep the encoder fast.
[profile.dev.package.jpeg-encoder]
opt-level = 3
